    --border: #252525;
    --text: #f0f0f0;
    --muted: #666;

  html, body {

  body {

    color: var(--text);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 48px;
    overflow-x: hidden;
    position: relative;
  }

  /* === BACKGROUND EFFECTS === */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(139,92,246,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* floating orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
    animation: orbDrift 12s ease-in-out infinite alternate;
  }

    from { transform: translate(0, 0) scale(1); }

    flex-direction: column;
    align-items: center;
